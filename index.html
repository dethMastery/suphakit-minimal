<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="https://suphakit.net/favicon.png" type="image/png" />
    <title>deth'z Minimal Page</title>

    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body>
    <div id="app">
      <div id="head" class="container">
        <div class="container-content">
          <h1 id="heading">SUPHAKIT P.</h1>
          <p id="sub-heading">
            A music producer who can do way too many things but you can't
            expected anything.
          </p>
        </div>
      </div>
      <div id="navbar" class="container">
        <div class="left">
          <a href="#head">/</a>
        </div>
        <div class="right">
          <a href="#about">About</a>
          <a href="#education">Education</a>
          <a href="#stats">Tech Stats</a>
          <a href="#contact">Contacts</a>
          <button onclick="themeChange()" id="themeButton">Theme 🌙</button>
        </div>
      </div>
      <div id="about" class="container">
        <div class="container-content" id="user-data">
          <div class="user-image-container">
            <div class="user-image"></div>
          </div>
          <div class="data-user"></div>
        </div>
      </div>
      <div id="education" class="container">
        <h1>
          Education Profile
        </h1>
        <div class="container-content"></div>
      </div>
      <div id="stats" class="container">
        <div class="container-content">
          <h1>Tech Stats</h1>
          <div id="tech-stats-list"></div>
        </div>
      </div>
      <div id="works" class="container">
        <div class="container-content">
          <h1>Works</h1>
          <div id="user-works"></div>
        </div>
      </div>
      <div id="contacts" class="container">
        <div class="container-content">
          <h1>Contacts</h1>
          <div id="user-contacts">

          </div>
        </div>
      </div>
      <div id="footer">

      </div>
    </div>

    <script src="/src/js/theme.js"></script>

    <script src="/src/js/data/user.js"></script>
    <script src="/src/js/data/education.js"></script>
    <script src="/src/js/data/skill.js"></script>
    <script src="https://suphakit.net/src/js/data/work.js"></script>
    <script src="/src/js/data/contacts.js"></script>
  </body>
</html>
